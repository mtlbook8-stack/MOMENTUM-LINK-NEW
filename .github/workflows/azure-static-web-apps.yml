name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued run should not overtake a running one.
concurrency:
  group: aswa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      # Until the deployment token exists there is nothing to deploy to, and a
      # red cross on every push would say less than this does.
      - name: Check for the deployment token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Azure deploy skipped::Set the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret (Azure portal -> your Static Web App -> Manage deployment token) to publish to Azure."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The site is already built and committed, so Oryx has nothing to do.
          app_location: "site"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close the preview environment
    steps:
      - name: Close
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        if: env.TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
